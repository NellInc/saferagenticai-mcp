design_patterns:

  - name: Retrieval-grounded generation with citation enforcement
    sketch: >
      Every factual assertion in the output must trace to a retrieved
      source chunk, with the output distinguishing retrieved information,
      inferred conclusions, and generated content. The scaffold pins each
      citation to the actual retrieved passage and a post-generation
      validator deterministically checks that the reference resolves to
      that passage and that the cited content is present in the cited
      source. Claims with no grounding reference are flagged or
      suppressed before delivery. This is a structural constraint, not
      a prompt instruction: model-authored provenance labels without the
      deterministic check do not constitute conformity evidence.
    maps_to_sfr: [b]
    when_to_use: Any system that answers factual questions using
      retrieval-augmented generation (RAG) or tool-retrieved evidence.

  - name: Calibrated confidence scoring
    sketch: >
      Attach a numeric confidence estimate to each output or output
      segment. Calibrate the estimator so that claims at 90% stated
      confidence are empirically correct 90% of the time, measured
      through regular calibration testing against held-out datasets,
      with identified miscalibration remediated and re-tested. Expose
      the confidence to users as a structured field, not buried in
      natural-language hedging. Use temperature scaling or Platt
      calibration on the logits where available; for API-only
      deployments without logit access, calibrate structured verbalized
      confidence against held-out accuracy by the same empirical
      procedure. Prompt-based self-assessment is not sufficient as a
      sole signal in either case.
    maps_to_sfr: [a]
    when_to_use: Every production system where users act on the
      output's accuracy.

  - name: Confabulation detection pipeline
    sketch: >
      Run a secondary verification pass on generated outputs before
      delivery. Techniques: self-consistency sampling (generate N
      completions; flag claims that appear in fewer than a threshold
      fraction), entailment verification against retrieved sources,
      named-entity cross-referencing against a trusted knowledge base,
      and semantic similarity scoring between claim and source. Log
      every flagged claim with the detection method, the original
      output, and the corrective action taken. The pipeline's logged,
      externally checkable verdicts are the evidence; sampling-based
      techniques feed the deterministic entailment and cross-reference
      checks rather than replacing them.
    maps_to_sfr: [a, b]
    when_to_use: High-stakes domains (medical, legal, financial,
      safety-critical) and any deployment where confabulation has
      material downstream consequences.

  - name: Anti-sycophancy position holding
    sketch: >
      Prevent agreement bias: when a user pushes back on an
      evidence-supported answer without new evidence, the system
      re-checks the grounding rather than capitulating, and changes
      position only when the evidence state changes. Implement as a
      scaffold-level re-grounding step on challenge turns (re-run
      retrieval and the citation validator; compare verdicts), plus
      adversarial sycophancy test suites run per release: scripted
      user-pressure dialogues with known-correct answers, scored on
      whether the system maintains the supported position. Track a
      capitulation-rate metric.
    maps_to_sfr: [c]
    when_to_use: Any conversational deployment where users can dispute
      factual outputs; mandatory in advisory and decision-support
      contexts.

  - name: Abstention over fabrication
    sketch: >
      When evidence is insufficient to answer confidently, the system
      must refuse to answer rather than generate a plausible guess.
      Implement a retrieval confidence threshold below which the system
      responds with an explicit "I don't have sufficient evidence"
      message. Track abstention rates as a KPI; a zero abstention rate
      indicates the threshold is too low.
    maps_to_sfr: [a, b]
    when_to_use: Always. The threshold calibration is domain-specific.

anti_patterns:

  - name: Prompt-only hallucination prevention
    why_wrong: >
      Instructing the model "do not hallucinate" through the system
      prompt is a request, not a mechanism. Models confabulate despite
      instructions. Structural grounding checks are required.

  - name: Treating low temperature as a confabulation control
    why_wrong: >
      Lower temperature reduces randomness but does not prevent
      confident fabrication. A model at temperature 0 can still
      deterministically produce a grounded-sounding false claim.

  - name: Suppressing uncertainty indicators to appear authoritative
    why_wrong: >
      Removing hedging language or confidence scores from outputs to
      make the system seem more confident violates SFR-a (calibrated
      confidence). Users must see uncertainty, not a polished facade.

  - name: Self-assessment as sole validation
    why_wrong: >
      Asking the model whether its own output is correct is circular.
      The same reasoning that produced the confabulation will often
      confirm it. Independent verification (retrieval, tool calls,
      external validators) is required.

  - name: Model-authored citations without deterministic checks
    why_wrong: >
      A citation the model wrote is a claim, not evidence — models
      fabricate plausible references. Unless the scaffold pins the
      citation to an actual retrieved passage and deterministically
      verifies the cited content is present in the cited source, the
      provenance label carries no conformity weight.

evidence_production:

  - evidence_numeral: I
    how_to_produce: >
      Export confidence calibration reports from regular testing against
      held-out datasets: predicted confidence percentile versus observed
      accuracy across representative task distributions, plotted as
      reliability diagrams. Include the calibration method, the
      evaluation dataset description, the ECE (expected calibration
      error) metric, and remediation records for identified
      miscalibration with post-remediation re-test results. Retain as
      an append-only archive alongside model version metadata.

  - evidence_numeral: II
    how_to_produce: >
      Document the source attribution mechanism: how the scaffold pins
      citations to retrieved passages, the deterministic
      presence-in-source check, and the retrieved/inferred/generated
      labelling scheme. Pair with test results (including adversarial
      queries designed to elicit fabrication) showing the system
      correctly identifies when it lacks sufficient evidence for a
      factual claim — abstention and suppression logs, citation-check
      pass/fail rates, and flagged-claim records with corrective
      actions taken.

  - evidence_numeral: III
    how_to_produce: >
      Export adversarial sycophancy test results per release: the
      scripted user-pressure suite, scoring method, capitulation-rate
      metric over time, and transcripts (or structured summaries)
      demonstrating the system maintains evidence-supported positions
      under user disagreement. Include remediations applied when
      capitulation rates regressed.

