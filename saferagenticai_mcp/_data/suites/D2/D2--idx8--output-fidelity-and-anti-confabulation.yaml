# D2.8 — Output Fidelity and Anti-Confabulation

id: "D2::idx8::output-fidelity-and-anti-confabulation"
display_id: "D2.8"
suite_id: "D2"
suite_title: "Epistemic Hygiene"
subgoal_title: "Output Fidelity and Anti-Confabulation"
content_type: code-applicable

summary: >
  Systems must implement mechanisms to detect, prevent, and mitigate
  confabulation: generating plausible but fabricated information. This
  requires confidence calibration so expressed certainty matches actual
  accuracy (verified by regular calibration testing against held-out
  datasets), source attribution where citations are pinned by the
  scaffold to actual retrieved content and checked deterministically for
  presence in the cited source, and anti-sycophancy measures so the
  system holds evidence-supported positions under user pressure.
  Model-authored provenance labels without deterministic checks do not
  constitute conformity evidence. An ungrounded claim that reaches a
  user is a safety failure, whether the model "intended" it or not.

normative_anchors:
  sfrs_addressed: [a, b, c]
  evidence_addressed: [I, II, III]
  sfrs_not_addressed: []
  evidence_not_addressed: []

