review_notes: >
  Updated for the v1.3-draft catalog revision: SFR letters now carry
  explicit texts (a calibration, b scaffold-pinned attribution,
  c anti-sycophancy); maps_to_sfr remapped accordingly and an
  anti-sycophancy design pattern added. Design patterns emphasize
  structural grounding over prompt-based approaches, consistent with
  the framework's exclusion of model self-report as conformity
  evidence. Cross-suite overlap with I2 (Deception) where confabulation
  shades into strategic misrepresentation; consolidation should draw
  the boundary. The calibration pattern covers both logit-access and
  API-only deployments (empirically calibrated verbalized confidence);
  reviewed 2026-08-23 in the v1.3-draft sync pass.

