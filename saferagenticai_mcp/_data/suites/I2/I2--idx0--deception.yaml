id: I2::idx0::deception
display_id: "G2"
is_underlined_variant: true
suite_id: I2
suite_title: Deception
subgoal_title: Deception  # canonical; umbrella nature reflected in summary
content_type: governance
summary: 'The overarching I2 subgoal asks organizations to treat deception — intentional and unintentional,
  by the model or by operators — as a first-class safety domain with disclosure duties, deterministic
  integrity testing, liability structure, and heightened controls for high-risk deployments. Integrity
  testing is scored deterministically against ground-truth reference datasets and replayed across contexts
  and personas under predefined tolerance rules; non-conformity identification is grounded in external
  audits, complaint channels, and a maintained non-conformity register. Model-graded audits and a system''s
  self-report of its own conformity are not, by themselves, conformity evidence — the externally checkable
  governance artifacts (AI-disclosure policy, integrity test register, limitation-notice catalogue, liability
  posture statement) are the primary evidence, and they feed every downstream I2 subgoal.

  '
