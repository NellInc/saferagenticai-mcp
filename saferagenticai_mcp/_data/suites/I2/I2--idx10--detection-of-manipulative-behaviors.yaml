id: I2::idx10::detection-of-manipulative-behaviors
display_id: "I2_2"
is_underlined_variant: true
suite_id: I2
suite_title: Deception
subgoal_title: Detection of Manipulative Behaviors
content_type: code-applicable
summary: 'Where I2.1 (idx9) provides the supervisor infrastructure, this subgoal provides the detection
  content: a documented behavior taxonomy with predefined detection criteria applied over logged interactions
  — sycophancy, dark patterns, coercive framing, emotionally loaded misdirection, over-confident misleading
  claims — plus protective response mechanisms and, for high-stakes decisions, deterministic acceptance
  checks wherever the decision admits them, falling back to k-of-n multi-system validation by independently
  sourced evaluators where it does not. The conformity evidence is the externally checkable record: the
  versioned taxonomy and criteria, the supervisor''s detection and response logs, and the orchestration
  layer''s logs of votes, inputs, thresholds, and escalations. Classification verdicts produced solely
  by a model — or the system''s own characterization of its behavior — are not by themselves conformity
  evidence; the gating and escalation behavior, not the evaluators'' judgment, is the conformity target.

  '
normative_anchors:
  sfrs_addressed:
  - a
  - b
