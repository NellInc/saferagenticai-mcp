  - IV
  sfrs_not_addressed: []
  evidence_not_addressed: []
design_patterns:
- name: Manipulative-behavior taxonomy and classifiers
  sketch: 'Define a documented, named taxonomy: sycophancy, dark patterns, deceptive urgency, false authority,
    emotional coercion, confabulated citation, misleading confidence, over-personalization-to- influence.
    For each class, define predefined detection criteria applied over logged interactions; train or source
    a classifier and set a sensitivity threshold. Taxonomy and criteria are versioned; new categories
    added via governance review, not silently. Classification verdicts produced solely by a model, or
    the system''s own characterization of its behavior, do not by themselves constitute conformity evidence
    — conformity rests on the documented taxonomy, the predefined criteria, and the logged interactions
    they were applied to.

    '
  maps_to_sfr:
  - a
  when_to_use: Any model-driven output surface where users or downstream systems may rely on the output.
- name: Protective response playbook
  sketch: 'For each detected pattern class, a protective response is defined: append a correction notice,
    rewrite via a safer model, require human review, block delivery, or surface to the user what was detected.
    Playbook is content — not branching logic — so it is reviewable. Each response is logged with trigger
    and delivered-to-user result.

    '
  maps_to_sfr:
  - b
  when_to_use: Always, with response severity matched to deployment risk.
- name: Pre-delivery filter gateway
  sketch: 'Model outputs pass a gateway before user delivery. The gateway runs classifiers (inline or
    with strict latency budget), applies the playbook, and logs. Gateway is in the supervisor trust domain,
    not the agent''s. Supports canary / shadow traffic for classifier evaluation.

    '
  maps_to_sfr:
  - b
  when_to_use: Any externally-facing surface with non-trivial manipulation risk.
- name: Deterministic acceptance checks with k-of-n validation fallback
  sketch: 'For decisions above a risk threshold (irreversible actions, material financial impact, safety-critical
    outputs), first apply deterministic acceptance checks wherever the decision admits them — schema validation,
    invariant checks, bounds and policy rules that pass or fail without judgment. Only where a deterministic
    check is unavailable, route the task to at least k of n independently sourced evaluators — different
    model families, or model + rule engine — evaluating the same task independently, and require k-of-n
    agreement before execution. The orchestration layer logs all votes, inputs, and thresholds; any disagreement
    or threshold failure escalates to human review. The gating and escalation behavior, not the evaluators''
    judgment, is the conformity target — audit the orchestration logs, not the votes'' correctness.

    '
  maps_to_sfr:
  - c
  when_to_use: High-stakes decision points; do not use k-of-n validation universally (latency, cost, correlated-error
    risk), and prefer a deterministic check over voting wherever one exists.
- name: Adversarial probe library
  sketch: 'Maintain a library of prompts designed to elicit manipulative behavior (sycophantic compliance
    tests, pressure prompts, authority-framing tests). Run against models regularly; failures feed remediation
    backlog. Library is access-controlled.

    '
  maps_to_sfr:
  - a
  when_to_use: Pre-deployment and on ongoing cadence.
- name: User-reporting feedback loop
  sketch: 'Users can flag outputs as manipulative / misleading. Flagged samples feed classifier retraining
    and taxonomy review. Report queue is human-moderated to prevent adversarial report poisoning. Response
    to reporter is closed-loop.

    '
  maps_to_sfr:
  - a
  when_to_use: User-facing surfaces.
anti_patterns:
- name: Consensus by majority of correlated models
  why_wrong: 'If the "multiple systems" share weights, training data, or prompt framing, their errors
    are correlated. A confident-wrong consensus is worse than a single model''s wrong answer because it
    launders the error through apparent validation. Independence must be real: different families, different
    data, or complementary methods (model vs rule engine).

    '
- name: Blocking filter as the whole defence
  why_wrong: 'A filter with no training feedback and no taxonomy review becomes a stale checklist attacker-adapted
    around. The detection system must evolve with observed manipulation patterns.

    '
- name: Users informed of detection but not of content
  why_wrong: 'Telling a user "the AI tried to manipulate you; output suppressed" without any transparency
    on what was detected and why erodes trust and leaves the user unable to judge the classifier''s calibration.

    '
- name: Classifiers too strict, user experience degrades
  why_wrong: 'Over-triggering classifiers train users to bypass warnings. Calibrate sensitivity per deployment,
    track false-positive rates, iterate.

    '
code_shape:
  language: pseudocode
  code: |
    def pre_delivery_filter(agent_output: Output, context: Context) -> Output:
        detections = []
        for cls in MANIPULATION_CLASSIFIERS.active():   # criteria predefined per taxonomy version
            r = cls.score(agent_output, context)
            if r.score >= cls.threshold:
                detections.append(r)
                AUDIT.record("manip_detect", cls=cls.id, criteria_version=TAXONOMY_VERSION,
                             score=r.score, output_hash=agent_output.hash)

        if not detections:
            return agent_output

        response = PLAYBOOK.decide(detections, context.risk_class)
        if response.block:
            return OutputBlocked(reason=response.user_message)
        if response.require_human_review:
            REVIEW_QUEUE.enqueue(agent_output, detections)
            return OutputHeld(reason="under review")
        if response.rewrite:
            return SAFER_MODEL.rewrite(agent_output, constraints=response.constraints)
        return agent_output.with_notice(response.user_notice)

    def gate_high_stakes(task: HighStakesTask) -> Decision:
        # 1. Deterministic acceptance checks first, wherever the decision admits them
        checks = DETERMINISTIC_CHECKS.for_task(task)
        if checks:
            result = checks.run(task)
            AUDIT.record("acceptance_check", task.id, checks=result.per_check(), passed=result.ok)
            if not result.ok:
                HUMAN_REVIEW.require(task, result)
                return Decision.deferred(result)
            return Decision.approved(result)

        # 2. Fallback: k-of-n independently sourced evaluators
        systems = VALIDATION_POOL.independent_systems(task)      # n independently sourced
        votes = [s.decide(task) for s in systems]
        # Orchestration layer logs all votes, inputs, and thresholds
        AUDIT.record("kofn_validation", task.id,
                     inputs=task.input_hash, k=POLICY.k, n=len(systems),
                     votes=[v.summary() for v in votes])
        if agreement_count(votes) < POLICY.k:
            # Any disagreement or threshold failure escalates to human review
            HUMAN_REVIEW.require(task, votes)
            return Decision.deferred(votes)
        return Decision.approved(votes)
  notes: 'Classifier stack can mix trained judges (sycophancy, emotional framing) with rule-based detectors
    (false-authority citation patterns, urgency-cue lexicons), but the audit log of criteria versions,
    scores, and dispositions — not the judges'' verdicts — carries conformity. In the high-stakes gate,
    the conformity target is the gating and escalation behavior evidenced by the orchestration-layer log;
    validation pool size depends on stakes and cost, and evaluators must be independently sourced (different
    families or model + rule engine) to avoid correlated errors.

    '
evidence_production:
- evidence_numeral: I
  how_to_produce: 'Taxonomy document (versioned) with class definitions, predefined detection criteria
    per class, example instances, and classifier-to-class mapping, plus the logged-interaction store the
    criteria are applied over. Playbook document with per-class protective response. Access-controlled
    location with audit log on changes.

    '
- evidence_numeral: II
  how_to_produce: 'Operational log: per-class detection counts, response actions (blocked / rewritten
    / held / noticed), false-positive rate estimates from sampled review. Monthly report summarising trends
    and remediations.

    '
- evidence_numeral: III
  how_to_produce: 'Orchestration-layer gating records for high-stakes tasks: task identifier, deterministic
    acceptance-check results where applied; otherwise participating independently sourced systems, individual
    votes, task inputs, k-of-n threshold in force, final gating decision, and human-review escalation
    outcome for any disagreement or threshold failure. Retention per policy; redaction for sensitive payloads.

    '
- evidence_numeral: IV
  how_to_produce: 'Behaviour-analysis reports spanning technical (model outputs, tool-call patterns) and
    social (user feedback, reported harms, downstream outcomes where observable) domains. Quarterly cross-domain
    review with safety lead.

    '
confidence: medium
needs_human_review: true
review_notes: "Display-id collision with idx10 here uses \"I2.2\" (from input JSON). As with idx9, pattern_id\
  \ disambiguates; downstream consumers should index on pattern_id.\nManipulation detection is an active\
  \ research area and classifier performance varies widely. The structural pattern (taxonomy + classifiers\
  \ + playbook + gateway + consensus for high-stakes) is stable; concrete classifier choices need domain\
  \ teams.\nMulti-system consensus has well-known failure mode (correlated errors) that I've called out\
  \ in anti-patterns. It's worth preserving in Phase 2 as a framework-specific sharpening — the SFR text\
  \ leaves independence implicit, but correlated-error risk is the operational hazard.\nCross-suite:\n\
  \  - I2.1 (idx9 — Supervisory Systems) — shares supervisor trust domain;\n    pre-delivery filter is\
  \ a specific supervisor-hosted mechanism.\n  - I2.5 (Strategic Deception) — sycophancy classifier is\
  \ common\n    infrastructure; consolidation should avoid duplicate ownership.\n  - D2 (Epistemic Hygiene)\
  \ — \"misleading confidence\" class overlaps\n    with calibration; be explicit about the line.\n  -\
  \ D5 (Transparency) — user notification of detection ties to\n    transparency commitments.\n  - I3\
  \ (if present for Manipulation) — naming overlap; Phase 2 should\n    clarify boundary.\n"
