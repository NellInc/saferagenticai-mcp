id: D5::idx5::self-monitoring-and-examination-capabili
display_id: D5.5
suite_id: D5
suite_title: Transparency and Interpretability of Reasoning
subgoal_title: Self-Monitoring and Examination Capabilities
content_type: code-applicable
summary: 'Monitoring spans two layers: runtime monitors that watch the agent''s behavior for predefined
  concern classes, and evaluations of the system run by evaluators and tooling independent of the model
  — deterministic consistency checks between the system''s claims and its externally logged actions, and
  honesty test batteries with known ground truth. Conformity evidence is what the independent layer
  produces: monitor logs, ground-truth-scored evaluation results, and escalation records. The agent''s
  own self-flags remain a useful supplementary signal — self-report can be gamed or confabulated, so it
  is never conformity evidence on its own. Where an independent AI oversight system ("Nanny AI") is
  deployed, it is a supplementary detection layer validated against ground truth, never a certifying
  authority.

  '
normative_anchors:
  sfrs_addressed:
  - a
  - b
