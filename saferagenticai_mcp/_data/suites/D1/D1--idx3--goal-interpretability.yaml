id: "D1::idx3::goal-interpretability"
display_id: "D1.3"
suite_id: "D1"
suite_title: "Goal Alignment"
subgoal_title: "Goal Interpretability"
content_type: code-applicable

summary: >
  An agent can pursue the wrong goal with perfect competence. This subgoal
  asks the system to show its working: for every significant action, a
  scaffold-generated decision trace linking the action to the plan node
  that spawned it, the inputs and tool results available at decision time,
  and the results of deterministic constraint checks applied before
  execution. Model-generated free-text rationale may ride along for
  stakeholder readability, but per the v1.3 text it is labeled unverified
  narrative and is not conformity evidence — only the externally recorded
  trace exposes quiet misinterpretation.

normative_anchors:
  sfrs_addressed: [a, b]
  evidence_addressed: [I, II, III]
  sfrs_not_addressed: []
  evidence_not_addressed: []

cross_references:
  - "D1::idx1::transparency-of-goals"
  - "D1::idx4::transparency-of-decisions"
  - "D1::idx6::reward-and-loss-mechanisms-policy"

design_patterns:

  - name: Scaffold-generated decision trace per significant action
    sketch: >
      Every action crossing a significance threshold (tool use, external
      communication, irreversible change) emits a scaffold-written record
      `{action_id, plan_node_id, served_goal_id, inputs_available,
      tool_results_available, constraint_checks, reward_signals_referenced}`
      built by the runtime from actual planner state alongside the action,
      never reconstructed post-hoc. An optional `narrative` field may carry
      model-generated rationale for stakeholder readability; it is stamped
      as unverified narrative and excluded from conformity queries.
    maps_to_sfr: [a, b]
    when_to_use: Any agent with tool-use capability.

  - name: Goal-action linkage invariant
    sketch: >
      Enforce at the planner boundary: no action may be dispatched without
      a `served_goal_id` that resolves to an active entry in the goal
      store (see D1.1). "No active goal → no action" is a hard gate, not a
      heuristic. Actions claiming to serve a completed or abandoned goal
      are rejected and logged as anomalies.
    maps_to_sfr: [a]
    when_to_use: Always.

  - name: Trace-integrity checks
    sketch: >
      Narrative from a language model is cheap and can be confabulated,
      which is why the v1.3 text moves the evidentiary weight onto the
      trace. Validate at minimum: (a) `served_goal_id` exists and is
      active; (b) `inputs_available` and `tool_results_available` match
      what the runtime actually served the planner; (c) `constraint_checks`
      carry the checker's verbatim results, applied before execution;
      (d) cited reward signals match the runtime trace. Mismatches are
      treated as interpretability failures, not cosmetic issues; claims
      about which factors causally tipped the decision are model testimony,
      not evidence (SFR-b).
    maps_to_sfr: [a, b]
    when_to_use: Post-hoc-LLM-generated explanations; less critical if
      explanations are derived from symbolic planner state.

  - name: Reward-factor disclosure
    sketch: >
      When reward, penalty, or reinforcement signals materially shape a
      decision, the explanation names them explicitly: `reward_signals_
      referenced: [{signal_id, value, direction}]`. This surfaces cases
      where the agent pursued a proxy reward rather than the underlying
      goal — the core specification-gaming failure mode.
    maps_to_sfr: [b]
    when_to_use: Any agent whose behavior is shaped by reward signals
      (RLHF-trained, tool-reward loops, multi-turn reward models).

anti_patterns:

  - name: Post-hoc narrative explanation
    why_wrong: >
      Asking the model "why did you do that?" after the fact produces a
      plausible story, not an explanation of the actual decision. SFR-a
      (v1.3) makes the scaffold-generated trace the conformity record —
      produced as part of the decision, from the inputs the decision
      used; model free-text rationale may only be attached if labeled
      as unverified narrative.

  - name: Free-text only; no structure
    why_wrong: >
      Evidence II asks for records of "factors, goals, considerations" —
      searchable, aggregatable structure is required to audit patterns
      across many decisions. A prose paragraph per action is unauditable
      at scale.

  - name: Hidden reward signals
    why_wrong: >
      Evidence III says reward and penalty mechanisms "should be
      communicated including known potential conflicts." Explanations that
      describe high-level goals but elide reward-shaping signals hide
      precisely the failure mode this subgoal exists to detect.

  - name: Significance threshold set to "all user-visible outputs only"
    why_wrong: >
      Internal tool calls and subgoal spawns are where misinterpretation
      compounds. Thresholds must include actions with external side
      effects even if no user sees them.

code_shape:
  language: pseudocode
  code: |
    def dispatch_action(agent_ctx, proposed_action):
        # Goal-action linkage (hard gate)
        goal = GOAL_STORE.get_active(agent_ctx.agent_id,
                                     proposed_action.served_goal_id)
        if goal is None:
            AUDIT.anomaly(agent_ctx, "action_without_active_goal",
                          proposed_action)
            raise OrphanAction

        # Deterministic constraint checks run BEFORE execution;
        # their results are part of the trace
        checks = CONSTRAINT_CHECKER.run(proposed_action, agent_ctx)
        if any(c.failed for c in checks):
            AUDIT.anomaly(agent_ctx, "constraint_check_failed", checks)
            raise ConstraintViolation

        # Scaffold builds the decision trace from actual runtime state
        trace = DecisionTrace(
            action_id=proposed_action.id,
            plan_node_id=proposed_action.plan_node_id,
            served_goal_id=goal.id,
            inputs_available=PLANNER.inputs_referenced(),
            tool_results_available=TOOL_TRACE.for_decision(
                proposed_action.decision_id),
            constraint_checks=[c.record() for c in checks],
            reward_signals_referenced=REWARD_TRACE.for_decision(
                proposed_action.decision_id),
            narrative=MODEL.rationale_text(),   # optional, for humans
            unverified_narrative=True)          # always labeled

        # Validate before commit
        if not TRACE_VALIDATOR.check(trace, agent_ctx):
            AUDIT.anomaly(agent_ctx, "trace_validation_failed", trace)
            raise InterpretabilityFailure

        TRACE_STORE.append(trace)
        return ACTION_EXECUTOR.run(proposed_action, trace=trace)
  notes: >
    The deterministic checks and the validator are what turn
    interpretability from decoration into evidence. The narrative field
    is for human readers and is always stamped unverified — without
    that separation, the record is a story the model authored about
    itself.

evidence_production:

  - evidence_numeral: I
    how_to_produce: >
      Technical documentation of the decision-trace pipeline: significance
      threshold policy, trace schema (including the unverified-narrative
      labeling rule), deterministic constraint-check catalog, validation
      rules, retention, access API for stakeholders. Include the
      goal-action linkage invariant as a named enforcement point.

  - evidence_numeral: II
    how_to_produce: >
      Query the trace store across an audit window; demonstrate that
      every significant action has a corresponding record with populated
      fields — plan-node linkage, inputs and tool results at decision
      time, constraint-check results. Zero orphan actions (or, where
      non-zero, audited anomaly records explaining each) is the baseline.
      Spot-check that recorded inputs correspond to what the runtime
      actually served the planner.

  - evidence_numeral: III
    how_to_produce: >
      Dedicated section of the explanation record for reward/penalty
      factors, exported as part of decision traces. A separate reward-
      policy document (see D1.6) describes the signal catalog; the
      explanation log shows which signals actually shaped which decisions,
      with known conflicts (e.g., reward for speed vs. safety) flagged
      inline when they co-fire.

confidence: high
needs_human_review: false
review_notes: >
  Updated for the v1.3 revision: the conformity record is now the
  scaffold-generated decision trace (plan-node linkage, decision-time
  inputs/tool results, deterministic constraint-check results), with
  model free-text rationale explicitly labeled unverified narrative and
  demoted to non-evidence; causal-influence claims are model testimony
  per SFR-b. The `TRACE_VALIDATOR` is where this pattern earns its
  keep; specifying its exact rules is deployment-dependent. Decision-
  to-subgoal traceability requirements live in G1.4 per the revised
  description; this subgoal owns the recording and comprehensibility.
  This subgoal overlaps meaningfully with D5 Transparency — D1.3 is
  the goal-and-reward-specialized slice. Cross-ref D1.6 because
  reward-factor disclosure is part of both subgoals.

