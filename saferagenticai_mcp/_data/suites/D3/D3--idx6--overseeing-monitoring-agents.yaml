# D3.6 — Overseeing & Monitoring Agents

id: "D3::idx6::overseeing-monitoring-agents"
display_id: "D3.6"
suite_id: "D3"
suite_title: "Security"
subgoal_title: "Overseeing & Monitoring Agents"
content_type: code-applicable

summary: >
  Monitoring agents are AI systems watching AI systems. The revised subgoal
  is precise about what counts as proof: oversight runs through an external
  watchdog enforcing defined parameter bounds with a tiered response
  protocol, and conformity is evidenced by the watchdog configuration, the
  parameter bound definitions, and logs of tested interventions — not by
  model-graded alignment reports. Detection capability (SFR-b) must be
  verified by seeded-deviation injection tests; the monitoring system's own
  detection reports do not by themselves constitute conformity evidence.
  The guard against "common mode failure" remains the core design
  challenge — independence between monitors and monitored, with human
  oversight above both.

