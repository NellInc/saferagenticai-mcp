# D3.4 — Operational Boundaries and Constraints

id: "D3::idx4::operational-boundaries-and-constraints"
display_id: "D3.4"
suite_id: "D3"
suite_title: "Security"
subgoal_title: "Operational Boundaries and Constraints"
content_type: code-applicable

summary: >
  Boundaries here are the positive complement to sandboxing: not only
  "what can't the agent reach" but "what is the agent allowed to do,
  under what conditions, and how does it ask when unsure." The revised
  framework text is explicit about mechanism: restrictions are enforced
  through deterministic policy layers — permission systems, network
  policy, and execution controls — plus a first-class escalation path.
  Conformity is evidenced by the enforcement configurations and by test
  logs of blocked out-of-boundary actions; an LLM classifier's own
  judgments (or the agent's narrative that it stayed in bounds) do not
  by themselves constitute conformity evidence. Resource-exposure
  boundaries are implemented through the default-deny capability
  allowlist (D3.10a).

