# D3.9 — Tool-Use Authorization and Egress Control

id: D3::idx9::tool-use-authorization-and-egress-contro
display_id: "D3.9"
suite_id: "D3"
suite_title: "Security"
subgoal_title: "Tool-Use Authorization and Egress Control"
content_type: code-applicable

summary: >
  Authorize every side-effecting tool call against what the current task
  delegated, not only against what the user may do or what the agent is
  able to do. An agent summarizing an email can hold a delete tool, act
  for a user allowed to delete the repository, and still delete it on an
  injected instruction; principal checks and capability allowlists both
  pass. The task grant must be set by the user or by configuration, held
  outside the model, and checked, arguments included, when the call
  executes. Routine reversible actions run freely inside the grant;
  irreversible or outward-facing ones need separate authorization.
  Egress control and tool-schema integrity complete the set.

normative_anchors:
  sfrs_addressed: [a, b, c]
  evidence_addressed: [I, II, III]
  sfrs_not_addressed: []
  evidence_not_addressed: []

