review_notes: >
  Revised 2026-10-05 alongside the D3.8 and D3.9 normative text, after
  deployment-side review by Fadi Arab: capability is not authority, and
  a principal's authority is broader than what any one task delegates,
  so D3.9a now binds calls to a task-scoped grant held outside the model
  and checked at execution. The paired delegated/undelegated test is
  his. Revised again 2026-10-15 after his further review: grants are
  tiered by consequence (routine reversible actions run freely,
  irreversible or outward-facing ones need explicit authorization, and
  only the principal extends a grant), and argument delegation is per
  field. Confidence is medium because task-type-to-scope mappings and
  field-level provenance are immature in practice, and the tiering
  has to be weighed against confirmation fatigue (see D6_5). Pairs with
  D3.10 (capability allowlist), D3.8 (provenance that feeds the
  argument gate), and D6.11 (reversibility assessment for tiering).
  Revised 2026-11-23: grants now explicitly travel with the task
  across agents and can only shrink (see I1.2), and a receiving
  agent's standing capabilities add no authority. D3.9a now says
  so (Proposal C, adopted 2026-11-24). The gap came to light through a
  use case from Bilal Ahmad; the travel-booking example is his.
