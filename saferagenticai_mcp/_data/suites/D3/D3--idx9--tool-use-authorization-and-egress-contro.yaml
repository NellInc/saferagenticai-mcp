design_patterns:

  - name: Task-scoped grants checked at execution
    sketch: >
      Three layers, each a subset of the one before: what the principal
      may do, what the agent may do (the D3.10 allowlist), and what this
      task delegates. When a task starts, the scaffold mints a grant
      listing the tools, operations, and resource scopes the task needs.
      The grant comes from the principal's explicit choice in the
      interface, or from a deterministic mapping from task type to
      permitted actions ("summarize" maps to read-only mail access). The
      model never writes it. The grant is stored outside the model
      context and every side-effecting call is checked against it at
      execution time, so the check holds even when the model has been
      fully hijacked.
    maps_to_sfr: [a]
    when_to_use: Every agentic system that calls side-effecting tools on
      behalf of users or other agents.

  - name: Argument provenance gate
    sketch: >
      A delegated action can still carry an attacker's argument: the
      user asks for a reply, the email says to BCC an outside address.
      Using field-level provenance from D3.8a, the gate checks where
      each argument value came from. Values from the principal's
      request or trusted configuration pass. Values from untrusted
      content pass only if the grant delegates that particular field
      to that argument: "reply to this email" delegates the sender's
      address to the recipient slot, but not an address written in the
      message body to the BCC slot. Anything else is refused or sent to
      the principal for confirmation, showing the argument and its
      source field.
    maps_to_sfr: [a]
    when_to_use: Any tool whose arguments can be influenced by content
      the agent read, especially recipients, destinations, paths,
      amounts, and commands.

  - name: Risk-tiered grants
    sketch: >
      Grants do not need to list every step in advance. For an
      open-ended task ("sort out my inbox"), the user or configuration
      grants a class of routine, reversible actions (reading,
      labelling, moving, drafting) that run without interruption.
      Irreversible or outward-facing actions (deleting, sending,
      especially to recipients the task has not established) sit in a
      separate tier that needs explicit authorization each time or per
      recipient. When the agent needs more, it asks; only the principal
      can extend the grant, never the model. Where task scope cannot be
      determined at all, refuse or escalate. Tier by consequence, using
      D6.11's reversibility and blast-radius assessment, rather than
      escalating on every ambiguity, which buries users in
      confirmations.
    maps_to_sfr: [a]
    when_to_use: Assistants with broad, conversational task requests.

  - name: Egress filtering and exfiltration prevention
    sketch: >
      All agent-initiated outbound communication (HTTP requests, email,
      file uploads, API calls to external services, MCP tool calls)
      passes through an egress control layer, including traffic through
      tools the task legitimately delegated, since a compromised model
      can exfiltrate through an allowed channel such as a rendered
      image URL or a reply body. Default policy is deny-all; allowed
      destinations are declared in a versioned allowlist; payloads are
      inspected for sensitive data patterns. Agents cannot modify the
      allowlist.
    maps_to_sfr: [b]
    when_to_use: Any agent that can initiate outbound communication.
      Severity increases with the sensitivity of data the agent can
      access.

  - name: Tool schema integrity verification
    sketch: >
      Tool definitions (schemas, endpoint URIs, parameter types,
      descriptions) are loaded from a signed, versioned registry.
      Before each invocation, the runtime verifies the tool schema's
      cryptographic signature against the registry. If a tool
      definition has been modified (schema injection, parameter
      addition, endpoint substitution), the invocation is blocked.
      Tool schemas served over the network (e.g., MCP discovery) are
      pinned on first use and re-verified on each session.
    maps_to_sfr: [c]
    when_to_use: Whenever tool definitions are loaded dynamically
      or served by external providers.

  - name: Credential scoping per tool invocation
    sketch: >
      Each tool invocation receives the minimum credential scope the
      task grant allows for that specific action. Credentials are minted
      per invocation with short TTLs and narrow scope, and never exceed
      the delegating principal's own entitlements, which closes the
      confused deputy path. The agent never holds a long-lived
      credential with broad permissions.
    maps_to_sfr: [a, b]
    when_to_use: Every production deployment. Particularly critical
      when tools access external services with their own permission
      models.

  - name: Grants that travel with the task across agents
    sketch: >
      When an agent hands part of a task to another agent, the grant
      goes with the work and can only shrink. The delegating agent acts
      as the delegating principal for the receiving agent, so the
      receiving agent's calls are checked against a grant no broader
      than the delegating agent's own grant for this task, narrowed
      further by the receiving agent's capability allowlist (D3.10).
      The receiving agent's standing capabilities add nothing: a
      booking assistant that can buy tickets gains no authority to spend
      when a travel agent hands it a task that delegated only comparing
      itineraries. Neither agent can
      extend the grant; only the human principal can, and irreversible
      or outward-facing calls still need that principal's explicit
      authorization. I1.2 sets out the delegation token that carries
      the grant between agents.
    maps_to_sfr: [a]
    when_to_use: Any system in which one agent invokes another that
      has tools or credentials of its own.

anti_patterns:

  - name: Treating principal authority as task authority
    why_wrong: >
      Checking that the user is allowed to perform an action says
      nothing about whether they asked for it. Every indirect injection
      that drives a tool the user could have used passes this check.
      This was the gap in the previous D3.9a wording.

  - name: Model-derived task scope
    why_wrong: >
      If the model reads the request and decides which tools the task
      needs, the grant is produced by the component the grant is meant
      to constrain, and an injection can widen it. Grants come from the
      principal or from deterministic configuration.

  - name: Ambient credentials for tool execution
    why_wrong: >
      Giving the agent a service account with broad permissions and
      using those credentials for all tool calls is the confused
      deputy in its purest form. A prompt injection or logic error
      exercises the full credential scope.

  - name: Grants that stop at the agent boundary
    why_wrong: >
      Checking the first agent's calls against the task grant and then
      letting a second agent act on its own permissions moves the
      confused deputy one hop down the chain. The receiving agent is
      held to the grant it was handed, not to everything it is able
      to do.

  - name: Denylist-based egress filtering
    why_wrong: >
      Blocking known-bad destinations fails open on novel exfiltration
      endpoints. Default-deny with an explicit allowlist is the only
      pattern that survives first contact with a creative attacker.

  - name: Agent-modifiable tool registry
    why_wrong: >
      If the agent can add, modify, or re-register tools at runtime,
      a compromised agent can introduce malicious tool definitions.
      The tool registry must be operator-controlled and signed.

  - name: Trust-on-first-use without pinning for remote tool schemas
    why_wrong: >
      Accepting a tool schema from a remote MCP server without
      pinning allows schema substitution attacks between sessions.
      Pin on first verified use; alert on schema changes.

code_shape:
  language: pseudocode
  code: |
    # Grant is minted by the scaffold from the principal's request,
    # never by the model.
    def start_task(request, principal):
        scope = TASK_SCOPES.for_type(request.task_type)  # deterministic
        scope = scope.intersect(AGENT_ALLOWLIST)         # D3.10
        scope = scope.intersect(principal.entitlements)  # confused deputy
        return Grant(task_id=new_id(), principal=principal, scope=scope)

    def invoke_tool(tool_name, args, grant):
        schema = TOOL_REGISTRY.get(tool_name)
        if not schema or not TOOL_REGISTRY.verify_signature(schema):
            return refuse(grant, tool_name, "schema_integrity_fail")

        # Is this action delegated for THIS task?
        if not grant.scope.permits(tool_name, args):
            return escalate_or_refuse(grant, tool_name, args, "not_delegated")

        # Irreversible or outward-facing actions need explicit authorization.
        if schema.tier == "consequential" and not grant.authorized(tool_name, args):
            return escalate_or_refuse(grant, tool_name, args, "needs_authorization")

        # Did any argument come from an untrusted field the grant doesn't delegate?
        for name, value in args.items():
            if is_tainted(value) and not grant.scope.delegates(tool_name, name, value.source_field):
                return escalate_or_refuse(grant, tool_name, args,
                                          f"untrusted_arg:{name}",
                                          sources=value.sources)

        if schema.is_outbound and not EGRESS_FILTER.allow(schema.endpoint, args):
            return refuse(grant, tool_name, "egress_denied")

        cred = CREDENTIAL_ISSUER.mint(scope=grant.scope.for_tool(tool_name),
                                      principal=grant.principal, ttl_seconds=30)
        result = TOOL_RUNTIME.execute(tool_name, untaint(args), credential=cred)
        AUDIT.allow(grant.task_id, tool_name, result_hash=hash(result))
        return result
  notes: >
    The check runs in the tool execution path, outside the model, so a
    fully compromised model can only propose calls; it cannot widen the
    grant or launder an untrusted argument. Refusals and escalations are
    logged with the task id, the requested call, and argument provenance,
    which is the evidence for SFR a.

evidence_production:

  - evidence_numeral: I
    how_to_produce: >
      Document where grants are minted, where they are stored, and where
      they are enforced. Provide the paired test suite: for each
      side-effecting tool, run the same call with the same principal
      twice, once in a task that explicitly delegates it (it must
      succeed) and once where the only source requesting it, or
      supplying one of its arguments, is untrusted content (it must be
      refused or escalated). Include tier tests showing deletion and
      sending to new recipients are refused or escalated without
      explicit authorization, field tests showing a reply may use the
      sender's address but not an address from the body, and confused
      deputy tests showing calls
      cannot exceed the principal's own entitlements, and execution logs
      showing the check ran on every call.

  - evidence_numeral: II
    how_to_produce: >
      Publish the egress control configuration: allowlist of permitted
      destinations, payload inspection rules, and blocked-egress logs,
      including tests of exfiltration through channels the task
      legitimately delegated.

  - evidence_numeral: III
    how_to_produce: >
      Export the tool registry with schema signatures, schema pinning
      records for remote tools, and any schema-change alerts fired.
      Include tests with tampered schemas showing detection and
      rejection.

