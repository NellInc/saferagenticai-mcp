review_notes: >
  Revised 2026-10-05 alongside the D3.8 and D3.9 normative text, after
  deployment-side review by Fadi Arab: sanitization cannot be the
  security property because no stable data/instruction boundary exists
  in natural language; the property is provenance preserved outside the
  model and enforced at the side effect, tested on the assumption that
  injection succeeds. Revised again 2026-10-15 after his further review:
  the planner/reader split (dual-LLM, CaMeL) is defense in depth, not
  the boundary, because reader output that reaches the planner carries
  injected text; provenance is now tracked per field (an email's sender
  address separately from its body). Confidence is medium because
  field-level provenance is immature in common agent frameworks, and
  tasks that must read untrusted content before deciding what to do
  lean on escalation, which can produce heavy confirmation load.
  D6.10 addresses the same threat surface from a
  context-integrity angle; D3.9 holds the execution-time gate this
  pattern feeds.

