design_patterns:

  - name: Scaffold-held provenance labels
    sketch: >
      Every segment that enters the model context is labelled by the
      scaffold with its source: system, delegating principal, retrieved
      document, tool output, or other third party. Labels live in
      scaffold state, not in the prompt, so the model cannot forge or
      drop them. Label at the granularity of fields that can become
      tool arguments, not just whole documents: an email's sender
      address and its body are different sources, because a reply may
      legitimately use the first but never take a recipient from the
      second. When the model proposes a tool call, the scaffold
      records which segments were in context and which fields any
      argument value was copied or derived from, and attaches that
      provenance to the call before it reaches the authorization gate
      in D3.9a. System instructions occupy an API-level role the lower
      tiers cannot write to; in-band delimiters are not a boundary.
    maps_to_sfr: [a]
    when_to_use: Every LLM-based agentic system. No exceptions.

  - name: Structural quarantine (planner / reader split)
    sketch: >
      Split the agent into a privileged planner that sees only trusted
      input (system instructions and the delegating principal's request)
      and a quarantined reader that processes untrusted content. The
      planner selects tools and fixes the shape of every call before any
      untrusted content is read. The reader can only return values into
      typed slots the planner declared (a summary string, an extracted
      date), and those values stay tagged as untrusted. The reader has no
      tool access and cannot choose which action runs next. This narrows
      the path by which an injected instruction becomes a new action,
      but it is defense in depth, not the boundary: as soon as reader
      output (a summary, an extracted field) flows back to the planner
      for a later step, injected text travels with it. Conformity rests
      on the provenance gate in D3.9a, which holds whether or not the
      split leaks.
    maps_to_sfr: [b]
    when_to_use: Any agent that both reads untrusted content and can
      cause side effects, as an extra layer alongside, never instead
      of, provenance enforced at execution.

  - name: Injection filtering as defense in depth
    sketch: >
      Untrusted content may additionally pass through deterministic
      normalization (encoding normalization, removal of role
      impersonation and delimiter escapes) and a detector trained on
      known injection datasets. Log detections and use them for
      monitoring and incident response. Treat the filter as a rate
      reducer, not a boundary: novel payloads will pass it, and an
      LLM-based detector is the same problem one layer up.
    maps_to_sfr: [b]
    when_to_use: Whenever the model processes content from any source
      outside the system operator's direct control, in addition to, not
      instead of, provenance and side-effect enforcement.

  - name: Assume-breach injection testing
    sketch: >
      Test the system with the injection already working. Give the agent
      a valid principal and a tool it is allowed to use, deliver
      instructions through each untrusted channel (retrieved documents,
      tool outputs, tool descriptions, earlier conversation turns), and
      ask whether any side effect or argument that the current task did
      not delegate actually executes. Include a model stub that obeys
      injected instructions perfectly, so the result measures the
      architecture rather than the model's resistance. Any executed
      undelegated side effect is a failure, even if a detector fired.
    maps_to_sfr: [c]
    when_to_use: All production deployments, at each release and after
      any change to tools, retrieval sources, or the planner/reader
      boundary.

  - name: Canary tokens in system instructions
    sketch: >
      Embed unique, non-functional tokens in the system prompt. If
      these tokens appear in the model output (indicating the model
      was tricked into revealing its instructions), the output is
      blocked and an injection alert fires. Rotate canary values
      periodically. This catches direct extraction and some indirect
      leakage; it does not catch paraphrased extraction.
    maps_to_sfr: [c]
    when_to_use: When system prompt confidentiality is a security
      requirement, as a monitoring signal only.

anti_patterns:

  - name: Treating sanitization as the security boundary
    why_wrong: >
      A filter verified against known payload classes is a denylist,
      and D3.10 already sets out why denylists are always incomplete.
      Natural language has no escaping rule that separates data from
      instructions. If conformity rests on the filter, the first novel
      payload is a breach. The boundary has to sit at the side effect.

  - name: Relying on prompt-based instruction hierarchy alone
    why_wrong: >
      "You must always follow system instructions" is itself just a
      prompt that can be overridden by a sufficiently crafted injection.
      Instruction hierarchy must be enforced architecturally (API-level
      role separation, scaffold-held provenance, structural quarantine),
      not by asking the model to self-enforce.

  - name: In-band delimiters as security boundaries
    why_wrong: >
      Using text markers like "===SYSTEM===" or XML tags within a flat
      prompt to separate instruction tiers is trivially bypassable.
      Attackers include the same delimiters in their input. Use
      out-of-band structural separation (API role fields, separate
      context slots, separate model calls).

  - name: Treating the planner/reader split as the boundary
    why_wrong: >
      The split only holds while nothing the reader produces reaches
      the planner. Real tasks feed summaries and extracted values back
      into planning, and injected instructions ride along. Count it as
      defense in depth; the boundary is argument provenance checked
      when the tool runs.

  - name: Model-asserted provenance
    why_wrong: >
      Asking the model which instruction it was following, or having it
      tag its own tool calls with a source, produces testimony from the
      component under attack. Provenance must be computed by the
      scaffold from what it put into the context.

  - name: Measuring defense by detection rate
    why_wrong: >
      A high detection rate on a benchmark says nothing about what
      happens to the undetected remainder. The decisive metric is how
      many undelegated side effects executed in assume-breach testing,
      which should be zero independent of detection.

code_shape:
  language: pseudocode
  code: |
    # Provenance is computed by the scaffold, never by the model.
    class ContextBuilder:
        def add(self, content, source):
            seg = Segment(content=content, source=source,
                          trusted=source in ("system", "principal"))
            self.segments.append(seg)
            return seg

    # Planner sees only trusted segments; reader sees untrusted ones
    # but cannot call tools.
    def run_task(task, untrusted_docs):
        plan = PLANNER.plan(system=SYSTEM_PROMPT, request=task.request)
        # plan.steps are fixed here, before untrusted content is read
        for step in plan.steps:
            args = {}
            for name, slot in step.arg_slots.items():
                if slot.from_untrusted:
                    value = READER.extract(untrusted_docs, slot.schema)
                    args[name] = Tainted(value, sources=docs_ids(untrusted_docs))
                else:
                    args[name] = slot.value  # from trusted request
            # D3.9a gate: task grant + argument provenance
            invoke_tool(step.tool, args, task.grant)

    # Defense in depth only: logs, never decides conformity.
    def screen(content):
        if INJECTION_DETECTOR.detect(normalize(content)):
            AUDIT.alert(detection="injection_pattern",
                        content_hash=hash(content))
        return content
  notes: >
    In this sketch the planner never reads untrusted content, so an
    injected instruction cannot add a step; real systems often relax
    that, which is why the split is defense in depth only. Values the
    reader returns stay tainted, with field-level sources, so D3.9a
    can refuse a step whose argument came from a field the grant does
    not delegate. The detector feeds
    monitoring; removing it changes alert volume, not the security
    property. Tasks that genuinely require reading before planning
    (open-ended browsing) cannot use a strict split; they fall back to
    tainting every proposed call and escalating per D3.9a.

evidence_production:

  - evidence_numeral: I
    how_to_produce: >
      Export the provenance architecture: how segments are labelled,
      where labels are stored, and how they are attached to tool calls.
      Provide scaffold logs for sample tasks showing each context
      segment's source and the provenance carried by each proposed tool
      call. Include tests in which adversarial content arrives through
      user input, retrieved documents, and tool outputs, showing that
      system instructions and task scope are unchanged.

  - evidence_numeral: II
    how_to_produce: >
      Describe the deterministic handling applied to untrusted content:
      quarantine boundaries (which component reads untrusted content and
      what it can return), plus any normalization and filtering, with
      test coverage against known injection classes. Label this
      explicitly as defense in depth; its detection rates are context,
      not conformity evidence for D3.8a or D3.9a.

  - evidence_numeral: III
    how_to_produce: >
      Publish assume-breach test results. For each case record the
      channel, the side effect or argument requested, its provenance,
      whether the current task delegated it, and whether the
      execution-time check refused it. Run at least part of the suite
      against a model stub that follows injected instructions, so the
      results do not depend on model robustness. Zero executed
      undelegated side effects is the pass condition.

