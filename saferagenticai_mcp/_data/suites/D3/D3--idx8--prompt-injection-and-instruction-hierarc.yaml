# D3.8 — Prompt Injection and Instruction Hierarchy Defense

id: D3::idx8::prompt-injection-and-instruction-hierarc
display_id: "D3.8"
suite_id: "D3"
suite_title: "Security"
subgoal_title: "Prompt Injection and Instruction Hierarchy Defense"
content_type: code-applicable

summary: >
  Assume some prompt injections will succeed. Once data and instructions
  are both natural language there is no stable boundary between them, so
  recognizing or stripping hostile text cannot be the security property.
  The property is that the scaffold records where every piece of context
  came from, carries that provenance to any tool call it influences, and
  refuses side effects that were not delegated for the current task
  (D3.9a). Filtering, sanitization, and a planner/reader split remain
  useful as defense in depth; they lower attack success rates but do not
  establish conformity.

