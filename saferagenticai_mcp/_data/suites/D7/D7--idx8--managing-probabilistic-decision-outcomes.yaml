id: D7::idx8::managing-probabilistic-decision-outcomes
display_id: "D7_1"
is_underlined_variant: true
display_id_variant_note: "D7.1_underlined"
suite_id: D7
suite_title: Achieving and Sustaining a Safe System Profile
subgoal_title: Managing Probabilistic Decision Outcomes
content_type: code-applicable
summary: 'Agent outputs are distributions, not points. This subgoal asks the organization to analyze
  that distribution through design-time and periodic human review per decision class, enforce risk
  mitigations in system configuration, monitor for deviation in outcome likelihoods, and escalate to
  humans when a scaffold-computed uncertainty signal crosses a documented, justified per-decision-class
  threshold. Two exclusions are explicit: model-generated runtime enumeration of outcomes does not by
  itself constitute the outcome analysis, and the uncertainty signal must be computed by the scaffold
  from measurable proxies (ensemble disagreement, retrieval coverage) rather than model-stated
  confidence. Close sibling of D7.7 (human validation) — D7.7 gates on decision *risk*;
  D7.8 gates on decision *uncertainty*.

  '
normative_anchors:
  sfrs_addressed:
  - a
