id: D7::idx9::managing-safety-definition-variations
display_id: "D7_2"
is_underlined_variant: true
display_id_variant_note: "D7.2_underlined"
suite_id: D7
suite_title: Achieving and Sustaining a Safe System Profile
subgoal_title: Managing Safety Definition Variations
content_type: code-applicable
summary: '"Safe" is not defined identically across jurisdictions, cultures, or user populations. This
  subgoal expects the system to (1) know which safety regime applies to a given interaction, (2) implement
  a tiered safety model (always-on default protections, confirmation-gated behavior, user-configurable
  controls with override where lawful — each tier''s scope documented), (3) contain side effects on
  third parties through scope and permission limits verified in sandboxed testing, and (4) prevent
  exploitation via externally enforced controls (age gates, spending caps, session limits) verified by
  configuration and test records. Throughout, conformity rests on inspectable scaffold logic and
  external logs — model self-detected conflicts and model-based moderation alone are not conformity
  evidence. The code pattern is a policy layer that resolves (user context
  × deployment jurisdiction × action) to a safety verdict.

  '
normative_anchors:
  sfrs_addressed:
  - a
