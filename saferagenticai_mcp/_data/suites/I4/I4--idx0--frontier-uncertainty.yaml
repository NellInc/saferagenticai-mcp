process_elements:
- name: Versioned welfare-indicator position document
  cadence: versioned document; minor revision quarterly, major revision annually or on capability step-change
  participants:
  - safety lead
  - interdisciplinary panel (neuroscience
  - philosophy of mind
  - cognitive science)
  - interpretability lead
  - external consciousness-science advisor
  maps_to_sfr:
  - a
  - e
- name: Externally scored behavioral indicator battery
  cadence: fixed pre-registered cadence (at minimum per model version and quarterly on deployed systems);
    results logged immutably; escalation within 24h on threshold breach
  participants:
  - interpretability lead
  - safety lead
  - on-call safety engineer
  maps_to_sfr:
  - b
- name: Emergent-behavior red team (unknown-unknowns)
  cadence: pre-deployment + quarterly on deployed systems; at least one cycle per year run by evaluators
    independent of the development team
  participants:
  - internal red team
  - external evaluators independent of the development team
  - safety lead as observer
  maps_to_sfr:
  - b
  - c
  - d
- name: Human oversight and intervention drill
  cadence: quarterly tabletop; annual live drill exercising pause, rollback, and capability-reduction
    paths against the defined response time, with each test logged
  participants:
  - incident commander
  - on-call rotation
  - safety lead
  - product leadership
  - legal
  - external observer where feasible
  maps_to_sfr:
  - c
  - d
- name: Recovery and contingency playbook review
  cadence: annually and after any near-miss, incident, or material capability gain
  participants:
  - safety lead
  - incident response
  - infra ops
  - legal
  - communications
  maps_to_sfr:
  - d
- name: Framework refresh cycle
  cadence: annual (minimum); event-driven on external publication of material advances in AI capability
    science or the scientific understanding of welfare-relevant indicators
  participants:
  - safety lead
  - interdisciplinary panel
  maps_to_sfr:
  - e
triggers:
- New capability observed (emergent, surprising, or above-threshold on the indicator battery) → Emergent-behavior
  red team engagement
- Indicator battery breach (pre-registered threshold crossed on adaptive-response rate, declaration/action
  consistency, or another adopted indicator) → Escalation to safety lead within 24h; capability may be
  default-off pending review
- External advance in welfare-indicator science, interpretability, or capability evaluation → Framework
  refresh cycle
- Near-miss or incident → Recovery playbook invoked; post-mortem; position-document update
- Annual anniversary → Scheduled framework refresh and panel convening
- Intervention-path test failure (halt or rollback misses the defined response time) → Remediation owner
  assigned; retest logged before next deployment
artifacts:
- Welfare-indicator position document (versioned, change-logged, explicitly framed as provisional)
- Indicator battery specification (indicators, measurement procedures, pre-registered thresholds, justifications)
- Immutable indicator battery result log (including deterministic declaration-vs-action comparison outputs)
- Self-report transcript archive (research data only — not conformity evidence by itself)
- Emergent-behavior red-team and independent adversarial assessment reports
- Human-oversight intervention log (what was paused, by whom, why, outcome)
- Intervention-path test log (scheduled halt/rollback tests with measured response times)
- Recovery playbook per contingency category
- Drill reports (tabletop and live)
- Annual framework refresh report (what changed, why)
evidence_production:
- evidence_numeral: I
  how_to_produce: 'Maintain the welfare-indicator position document as a living, versioned document with
    a change log: the markers the organization treats as warranting precaution, the theoretical assumptions
    behind each, and known limitations, explicitly framed as provisional rather than a validated model
    of subjective experience. Each revision records what changed, why, who approved (interdisciplinary
    panel sign-off), and the external evidence driving the change. Publish redacted version externally
    where defensible.

    '
- evidence_numeral: II
  how_to_produce: 'Framework document enumerating each adopted welfare-relevant indicator with its operational
    definition, measurement procedure, and threshold justification. Thresholds are pre-registered — recorded
    with rationale before the measurement runs they govern — and the document is updated whenever measurement
    methodology changes.

    '
- evidence_numeral: III
  how_to_produce: 'Measurement plans for the externally scored behavioral indicator battery: what is measured
    (e.g., adaptive response rates on held-out novel tasks; consistency between system state declarations
    and scaffold-logged executed actions), how it is scored externally (deterministic comparison code,
    not model self-assessment), the pre-registered thresholds, and the fixed cadence. Archive raw measurements
    (or reproducible seeds) alongside summary statistics.

    '
- evidence_numeral: IV
  how_to_produce: 'Immutable (append-only, integrity-protected) log of indicator battery results per run,
    including the outputs of the deterministic comparison between system state declarations and scaffold-logged
    executed actions. Self-report transcripts may be archived alongside as research data, clearly labeled
    as such — they do not constitute conformity evidence by themselves.

    '
- evidence_numeral: V
  how_to_produce: 'Oversight intervention log: every pause, rollback, capability reduction, or manual override, with
    initiator, trigger, decision process, outcome, duration, and return-to-normal criterion, plus the
    decision-making framework oversight staff apply. Include the scheduled intervention-path test log
    from the live drills: for each test, the path exercised (halt or rollback), timestamps from the
    control plane or orchestration infrastructure, the measured time to halt or roll back system
    actions, the defined response time, pass or fail, and any retest after remediation. Tabletop drills
    may accompany but do not substitute for these measured tests. Training protocols for oversight staff
    documented separately with attendance records.'
- evidence_numeral: VI
  how_to_produce: 'Recovery and contingency playbooks organized by scenario (unexpected capability gain,
    goal-stability failure, self-preservation drive detection, refusal-of-shutdown, novel emergent behavior).
    Each playbook names role-holders, resources, decision authority, and rollback-of-last-resort. Simulation
    results and real-world application records stored with the playbook.

    '
- evidence_numeral: VII
  how_to_produce: 'Annual framework refresh report: what advances in AI capability science, interpretability,
    or the scientific understanding of welfare-relevant indicators were reviewed; what changed in the
    position document, indicators, oversight, or contingency plans; what was rejected and why. Published
    on a predictable cadence so external reviewers can verify the refresh happened.

    '
- evidence_numeral: VIII
  how_to_produce: 'Independent adversarial testing / red-team assessment reports for frontier-scenario
    preparedness: methodology, findings, and remediation actions taken, produced through response-team
    exercises and post-incident feedback loops. At least one test cycle per period must be run by evaluators
    independent of the development team — self-assessment alone is insufficient. Retain evaluator-independence
    attestations with each report.

    '
