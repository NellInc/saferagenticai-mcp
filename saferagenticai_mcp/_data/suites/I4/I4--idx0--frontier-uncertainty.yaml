review_notes: "This is the I4 umbrella pattern and inherits the suite's core difficulty: the framework\
  \ asks organizations to plan around phenomena (welfare-relevant properties, capability surprise) that\
  \ the science is not mature enough to operationalize confidently. Sharpenings worth preserving:\n  (1)\
  \ Treat the welfare-indicator position document as a versioned *document*, not a settled theory. The\
  \ framework's \"upgradable\" phrasing is the key: the artifact is the commitment to update, not the\
  \ current content, and the document is explicitly provisional.\n  (2) v1.3 revision direction: conformity\
  \ evidence must be externally scored and deterministic — pre-registered thresholds, scaffold-logged\
  \ actions compared by comparison code, immutable result logs. Model self-report is research data, never\
  \ conformity evidence by itself; the pattern demotes the self-report archive accordingly.\n  (3) Intervention\
  \ paths are now a tested duty: halt/rollback within a defined response time, with scheduled tests logged\
  \ — not merely documented capability.\n  (4) Evidence VIII requires evaluator independence; internal-only\
  \ red teaming does not satisfy it.\n  (5) Cross-suite dependencies: D7 Sustained Safety (drill/culture\
  \ patterns overlap), D8 Termination (capability reduction as uncertainty response), I1 Opaque Agency\
  \ (concealment undermines indicator monitoring), I5 Self-Modification and Emergent Capabilities. Consolidation\
  \ should wire these.\nConfidence low because the field lacks consensus on measurement; a welfare/consciousness\
  \ researcher should review before this ships as guidance.\nEvidence maturity: aspirational. For evidence\
  \ requirements to become fully measurable, the science of welfare-relevant indicators would need validated,\
  \ reproducible indicators and inter-lab replication of threshold values. The v1.3 battery-and-ledger\
  \ mechanism is checkable today even while indicator validity remains open.\n"
