review_notes: 'Allocation/fairness/quotas is canonical resource-scheduler engineering (k8s scheduler,
  YARN, SLURM). Framework-specific: the v1.3 requirement that organizations define, justify, and monitor
  their own fairness and headroom thresholds (replacing the earlier fixed 10% / 90% anchors), capacity
  assessment from independent benchmarks rather than agent self-declaration, and the explicit linkage
  to termination/cascade prevention. Burst workloads may justify different bands with more aggressive drain. Suspected cross-suite dependency:
  D3 Security (starvation as attack vector); D6 Resource Limits if such a suite exists; I6 Imbalance (resource
  fairness as a within-org analog).

  '
