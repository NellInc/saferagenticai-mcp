triggers:
- New confirmation surface proposed → budget design review
- Elevated click-through rate on a warning → decision support redesign
- User feedback pattern indicating fatigue (e.g., reports of "too many prompts") → user feedback loop
  triage
- Safety event traceable to click-through behavior → oversight- fatigue balance review + incident corpus
  entry (D6.1)
- Proposed increase in user confirmation frequency → mandatory budget review; default posture should be
  "justify the ask"
artifacts:
- Confirmation Budget policy document (risk-tier definitions gating which actions prompt — irreversible
  and shared-scope only — batching rules for related requests, target total prompts per user session,
  per task, target cognitive-load ceilings for specific flows)
- Confirmation-frequency metric definition (per session), its dashboards, and the defined review trigger
  with records of triggered reviews and threshold adjustments
- Per-feature decision-surface design specifications, including scaffold-templated decision-brief templates
  and the logged-data fields that populate them
- Decision-quality telemetry definitions and dashboards
- User-feedback synthesis reports
- Oversight-fatigue balance review minutes
evidence_production:
- evidence_numeral: I
  how_to_produce: 'System activity records for user interactions: per-session counts of confirmation prompts,
    consent dialogues, clarification requests, interruptive warnings. Segmented by user cohort and flow.
    Retained for trend analysis; part of the analytics pipeline rather than ad-hoc log digging.

    '
- evidence_numeral: II
  how_to_produce: 'Analysis reports: frequency distributions of decisions users face, correlation with
    outcomes (completion rate, error rate, satisfaction, safety events), identified fatigue hotspots.
    Quarterly; feeds product backlog for decision-surface simplification.

    '
- evidence_numeral: III
  how_to_produce: 'Decision-support effectiveness documentation: for each support surface (scaffold-templated
    decision brief, progressive disclosure, contextual help), the template definition, the logged system-data
    fields it renders from, and pre/post metrics on decision quality (correctness, time, satisfaction),
    user-reported clarity. A/B tests where feasible; qualitative research where not. A model-authored
    free-text summary alone does not evidence the required decision brief.

    '
