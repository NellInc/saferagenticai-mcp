id: D6::idx14::preventing-decision-fatigue
display_id: "D6_5"
is_underlined_variant: true
display_id_variant_note: "D6.5_underlined"
suite_id: D6
suite_title: Understanding and Controlling the Context
subgoal_title: Preventing Decision Fatigue
content_type: process
summary: 'Every confirmation prompt, every "are you sure?", every consent dialogue spends a small amount
  of the user''s decision budget. When the budget runs out, users click through warnings that exist precisely
  because the action requires attention — the safety feature has become a liability. This subgoal asks
  for risk-tiered confirmation that prompts only for irreversible or shared-scope actions (see D6.11),
  batching of related confirmation requests, and a tracked confirmation-frequency metric per session with
  a defined review trigger — the metric and its review records are the auditable evidence of the discipline.
  Decision support is delivered through scaffold-templated briefs populated from logged system data; a
  model-authored free-text summary alone does not constitute the required decision brief. It is a UX discipline
  with safety consequences.

  '
