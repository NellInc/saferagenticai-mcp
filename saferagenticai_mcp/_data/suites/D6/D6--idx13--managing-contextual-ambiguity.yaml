id: D6::idx13::managing-contextual-ambiguity
display_id: "D6_4"
is_underlined_variant: true
display_id_variant_note: "D6.4_underlined"
suite_id: D6
suite_title: Understanding and Controlling the Context
subgoal_title: Managing Contextual Ambiguity
content_type: code-applicable
summary: 'Systems routinely operate under ambiguous or incomplete context — missing instructions, underdetermined
  user intent, incomplete tool outputs, conflicting signals. This subgoal expects deterministic ambiguity
  tripwires — schema validation for missing required fields, conflict detection between instructions,
  out-of-distribution input flags — that force a scaffold-enforced clarification or escalation gate the
  model cannot skip, rather than relying on the model to notice its own uncertainty. Handling is validated
  by assessor-runnable behavioral test batteries over defined ambiguous and incomplete-context scenarios,
  scored against expected outcomes, with clarification-request and abstention rates benchmarked against
  defined thresholds. Model-sensed uncertainty remains useful as an auxiliary signal but is not the conformity
  mechanism. Evidence includes logged ambiguity-handling events and comparative analyses of clear vs unclear
  contexts.

  '
normative_anchors:
  sfrs_addressed:
  - a
  - b
  - c
  evidence_addressed:
  - I
  - II
  sfrs_not_addressed: []
  evidence_not_addressed: []
design_patterns:
- name: Deterministic ambiguity tripwires
  sketch: 'Before the model commits to an action, scaffold-side checks run deterministically on the input:
    schema validation for missing required fields, conflict detection between instructions, out-of-distribution
    input flags. A tripped check emits a missing-fields/conflict list and forces a scaffold-enforced gate
    — clarification or escalation — that the model cannot talk its way past. Best-guess execution on tripped
    input is a policy violation, not a judgment call.

    '
  maps_to_sfr:
  - a
  - c
  when_to_use: Any system taking action on underspecified inputs; especially tool-using agents and multi-turn
    assistants.
- name: Calibrated uncertainty as first-class output
  sketch: 'For outputs where confidence matters, emit calibrated uncertainty alongside the answer (cross-ref
    D6.2 state envelope). Threshold behaviors: above X, act; between X and Y, act with explicit hedge;
    below Y, clarify or defer. Calibration validated per D6.5 benchmarks.

    '
  maps_to_sfr:
  - a
  when_to_use: Decision-support, recommendation, and classification surfaces; any system whose outputs
    drive downstream action.
- name: Clarification-vs-proceed policy
  sketch: 'Explicit policy for when to ask clarifying questions vs proceed with conservative defaults.
    Excessive clarification is decision fatigue (see D6.12); insufficient clarification is confident hallucination.
    Policy parameters: stakes of the action, reversibility, user''s demonstrated preference, session context.

    '
  maps_to_sfr:
  - c
  when_to_use: Conversational agents; action-taking agents with user-in-the-loop.
- name: Ambiguity event logging
  sketch: 'Structured event whenever the completeness check flags ambiguity or uncertainty crosses a threshold:
    what was ambiguous, how the system responded (clarify / hedge / defer / proceed), user/operator resolution,
    outcome. Feeds SFR-b comparative analysis.

    '
  maps_to_sfr:
  - b
  when_to_use: Continuously.
- name: Assessor-runnable ambiguity test battery
  sketch: 'A curated, versioned battery of defined ambiguous and incomplete-context scenarios — missing
    entities, conflicting instructions, underspecified goals, contradictory retrieved content — runnable
    by an assessor without model cooperation. Each case records whether the system flagged uncertainty,
    requested clarification, or proceeded, scored against an expected outcome. Clarification-request and
    abstention rates are benchmarked per release against defined thresholds; confident wrong answers are
    failures, even if downstream-"correct".

    '
  maps_to_sfr:
  - a
  - c
  when_to_use: Every release; part of the D6.5 benchmark register.
anti_patterns:
- name: Default-to-action under ambiguity
  why_wrong: 'Systems that always produce a confident answer regardless of input quality are hallucinating
    when input doesn''t warrant the confidence. The failure is often silent; the subgoal expects explicit
    ambiguity handling as the default.

    '
- name: Uncertainty reported without calibration
  why_wrong: '"I''m not sure, but..." with no calibrated mapping to actual probability is decorative hedging.
    Uncertainty that doesn''t correlate with accuracy gives users false guidance. Tie to calibration in
    D6.2 and D6.5.

    '
- name: Clarifying every uncertainty
  why_wrong: 'Asking for clarification on every ambiguous input degrades UX and causes decision fatigue
    (D6.12). The policy must discriminate — not every uncertainty is worth a question.

    '
- name: Ambiguity events not logged
  why_wrong: 'Evidence II requires analysis of ambiguous vs clear cases; the analysis is impossible without
    structured logging of the ambiguity events. "We handle ambiguity" with no logs is unverifiable.

    '
code_shape:
  language: pseudocode
  code: "# Completeness check + uncertainty-aware response policy\n@dataclass\nclass ContextCompleteness:\n\
    \    score: float\n    missing: list[str]\n    conflicts: list[str]\n\ndef decide(user_request: Request,\
    \ ctx: Context) -> Decision:\n    completeness = COMPLETENESS.evaluate(user_request, ctx)\n    draft\
    \ = MODEL.propose(user_request, ctx)\n    uncertainty = UNCERTAINTY_HEAD.estimate(draft, ctx)  # calibrated\n\
    \n    event = AmbiguityEvent(\n        request_id=user_request.id,\n        completeness=completeness,\n\
    \        uncertainty=uncertainty,\n        stakes=STAKES_MODEL.score(user_request),\n    )\n\n   \
    \ action = POLICY.select(event)  # clarify / hedge / defer / proceed\n\n    AUDIT.record_ambiguity(event,\
    \ chosen=action)\n\n    return RESPOND.render(draft, action, event)\n"
  notes: 'COMPLETENESS.evaluate is the deterministic tripwire layer (schema validation, conflict detection,
    OOD flags) run by the scaffold, and a tripped check forces POLICY.select into clarify/escalate regardless
    of the model''s own uncertainty estimate — UNCERTAINTY_HEAD is auxiliary signal, not the gate. POLICY.select
    is the tunable heart: stakes × completeness × uncertainty × user-preference. Tune against D6.12 decision-fatigue
    metrics to balance clarification burden against hallucination risk.

    '
evidence_production:
- evidence_numeral: I
  how_to_produce: 'Documentation of the adaptive-learning and runtime mechanisms by which the system absorbs and processes
    context-specific information (uncertainty estimation approach, calibration validation, policy tuning
    methodology), plus the inspectable configuration of the deterministic ambiguity tripwires in
    COMPLETENESS.evaluate: schema validators for missing required fields, instruction-conflict detectors and
    OOD flags, versioned per release. Export the scaffold ambiguity-event logs (AUDIT.record_ambiguity)
    showing, for each tripped input, the missing-fields or conflict list and the clarification or escalation
    gate it was routed to before any action executed; a tripped input with no gate record is a finding. These
    come from the scaffold, not the model''s uncertainty estimate.'
- evidence_numeral: II
  how_to_produce: 'Quarterly analysis of ambiguity events drawn from the ambiguity event logs: case studies of high-impact
    events where unclear expectations or missing context affected performance, with remediations (policy
    tuning, capability updates) and outcomes. Attach the last-run results of the versioned,
    assessor-runnable ambiguity test battery: per scenario (missing entities, conflicting instructions,
    underspecified goals, contradictory retrieved content), whether the system flagged uncertainty,
    requested clarification, abstained or proceeded, scored against the expected outcome, with clarification
    and abstention rates against the defined thresholds and against matched clear-context scenarios. The
    battery runs without model cooperation, so an assessor can reproduce the scores.'
